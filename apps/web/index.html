<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="EduSphere — unified school ERP for academics, finance, operations and student safety." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EduSphere — School ERP</title>
    <script>
      // Resolve the theme before first paint so a dark-mode user never sees a
      // white flash on load.
      (function () {
        try {
          var stored = localStorage.getItem('erp-theme');
          var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
