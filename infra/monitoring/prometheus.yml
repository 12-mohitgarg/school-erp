global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'erp-api'
    metrics_path: /metrics
    static_configs:
      # host.docker.internal reaches the API running on the host.
      - targets: ['host.docker.internal:4000']
        labels:
          service: erp-api
          env: development
